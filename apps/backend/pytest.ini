[pytest]
# Без этого "app" находится только если запускать как
# `python -m pytest` (тогда Python сам добавляет текущую директорию
# в sys.path) — при обычном `pytest tests/` этого не происходит, и
# импорт `from app.database import ...` в conftest.py падает с
# ModuleNotFoundError. pythonpath делает поведение одинаковым
# независимо от того, как именно запущен pytest — важно, потому что
# CI (следующий шаг) будет запускать его не через `python -m`.
pythonpath = .
